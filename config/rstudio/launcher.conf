[server]
address=127.0.0.1
port=5559
server-user=rstudio-server
admin-group=rstudio-server
authorization-enabled=1

# debug logging is very helpful at start, but can be disabled later to prevent log files piling up 
enable-debug-logging=1

# Important setting for Local Launcher to ensure resource assignments are respected. 
enable-cgroups=1

# SLURM Cluster
# where Workbench Jobs will be executed  
[cluster]
name=PCS-Slurm
type=Slurm

